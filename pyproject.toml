[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "chronoscholar"
version = "1.0.0"
description = "Temporally-aware research memory agent with Cognee knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Cognee
    "cognee>=0.1.15",
    # arXiv
    "arxiv>=2.1.0",
    # LLM Providers
    "groq>=0.9.0",
    "google-generativeai>=0.8.0",
    # Graph Visualisation
    "pyvis>=0.3.2",
    # Experiment Tracking
    "mlflow>=2.14.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring multi-component fixtures",
    "benchmark: ground truth benchmark tests — run manually only",
]
filterwarnings = [
    "ignore::FutureWarning:instructor.*",
    "ignore::DeprecationWarning:cognee.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# Coverage threshold reflects unit-testable surface only.
# Integration paths (Cognee graph ops, /compare LLM calls,
# FastAPI lifespan) are covered by manual smoke tests.
# See scripts/seed_corpus.py and scripts/prewarm_cache.py.
fail_under = 60
show_missing = true
